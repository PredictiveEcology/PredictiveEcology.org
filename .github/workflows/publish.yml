## Renders the website and training book with one pinned Quarto, so nobody
## commits rendered HTML. Authors commit sources, and optionally the matching
## _freeze/ results. With `freeze: auto`, Quarto executes only chapters whose
## source changed or has no freeze; CI then commits the new _freeze/ back so
## the chapter is not executed again.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

name: Quarto Publish

concurrency:
  group: quarto-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip-ci]') }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      USERNAME: GHA
      GOOGLE_APP_CREDENTIALS: ${{ secrets.GOOGLE_AUTHENTICATION_CREDENTIALS }}
      ## Only same-repo PR branches and main can receive the _freeze/ commit.
      PUSH_FREEZE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ## A PR's branch itself (not the merge commit), so _freeze/ can be pushed to it.
          ref: ${{ github.event_name == 'pull_request' && env.PUSH_FREEZE == 'true' && github.head_ref || '' }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.32

      - uses: PredictiveEcology/actions/install-apt-packages@main
        with:
          packages: libarchive-dev

      ## System libraries, R, and the packages listed in DESCRIPTION (cached).
      ## Quarto bundles its own pandoc.
      - uses: PredictiveEcology/actions/setup-r-deps@main
        with:
          pandoc: false

      - name: Build site 🔧
        run: Rscript R/renderCopyBook.R

      - name: Commit new _freeze/ results
        if: env.PUSH_FREEZE == 'true'
        run: |
          git add _freeze training/_freeze
          if git diff --cached --quiet; then
            echo "No new _freeze/ results."
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Update _freeze/ from CI render [skip-ci]"
            git push
          fi

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
